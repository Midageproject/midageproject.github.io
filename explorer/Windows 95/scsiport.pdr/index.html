<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Midage Crisis</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header>
    <a href="/" class="logo"><span>🌍</span>Semetary</a>
    <nav>
      <a href="/">HOME</a>
      <a href="https://github.com/Midageproject"><img src="/assets/github-mark-white.png" alt="GitHub" width="40" height="40"></a>
    </nav>
  </header>


<div class="appearance-block">
  <h2>SCSIPORT — Windows 95</h2>
<hr class="segment-separator">


  <div class="tree-and-segments">
  <div class="source-tree-scroll">
    <h3>Source Tree</h3>
    <ul>
      
        <li>Address.H</li>
      
        <li>IoAddress.H</li>
      
    </ul>
  </div>


<hr class="segment-separator">
  <div class="segments">
  
    <details class="segment">
      <summary>
        Segment 1: _LGROUP @ 00000000
      </summary>
      <ul>
        
          <li data-segment="00000000" data-offset="00004878">
            <code>00004878</code> — SCSIPORT_DDB
            
          </li>
        
          <li data-segment="00000000" data-offset="0000DA80">
            <code>0000DA80</code> — _ScsiDebug
            
          </li>
        
      </ul>
    </details>
  
</div>

</div>

<script>
  const symbolItems = document.querySelectorAll('.segments li');
  symbolItems.forEach(item => {
    item.addEventListener('click', () => {
      const seg = parseInt(item.dataset.segment, 16);
      const off = parseInt(item.dataset.offset, 16);
      const abs = seg + off;
      const addrStr = '0x' + abs.toString(16).padStart(8, '0').toUpperCase();
      navigator.clipboard.writeText(addrStr);
      symbolItems.forEach(i => i.classList.remove('symbol-copied'));

    item.classList.add('symbol-copied');
    });
  });
</script>

</div>
</div>


</body>
</html>
